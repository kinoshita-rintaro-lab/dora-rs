[project]
name = "dora-so101-collect-ui"
version = "0.1.0"
description = "Web UI for the SO-101 episode recorder"
readme = "README.md"
authors = [
    { name = "madamadamadao" }
]
requires-python = ">=3.12"
dependencies = [
    "dora-rs>=1.1.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
dora-so101-collect-ui = "dora_so101_collect_ui.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
