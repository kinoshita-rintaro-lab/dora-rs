nodes:
  - id: leader
    path: dora-so101-leader
    inputs:
      tick: dora/timer/hz/60
    outputs:
      - leader_cmd
    env:
      PORT: /dev/ttyACM1

  - id: follower
    path: dora-so101-follower
    inputs:
      cmd: leader/leader_cmd
    outputs:
      - follower_state
    env:
      PORT: /dev/ttyACM0

  - id: wrist-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video6
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg

  - id: overhead-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video4
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg

  - id: rerun
    path: dora-so101-rerun
    inputs:
      wrist: wrist-camera/image
      overhead: overhead-camera/image
      leader: leader/leader_cmd
      follower: follower/follower_state
    env:
      IMAGES: overhead, wrist
      ACTIONS: leader
      OBSERVATIONS: follower
      JOINTS: shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper

  # One dataflow run records one episode: recording starts with the
  # graph (AUTO_START) and finishes when the graph stops. The episode
  # number is the next free number in the dataset, so restarting the
  # graph records the next episode. AUTO_FINISH decides the success
  # flag written for the automatically finished episode.
  - id: record
    path: dora-so101-record
    inputs:
      action: leader/leader_cmd
      state: follower/follower_state
      camera_wrist: wrist-camera/image
      camera_overhead: overhead-camera/image
    env:
      DIRECTORY: ../record
      NAME: so101
      TASK: Pick up the cube and place it in the box
      AUTO_START: "true"
      AUTO_FINISH: success
