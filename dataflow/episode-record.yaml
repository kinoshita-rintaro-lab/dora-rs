nodes:
  - id: leader
    path: dora-so101-leader
    inputs:
      tick: dora/timer/hz/120
    outputs:
      - leader_cmd
    env:
      PORT: /dev/ttyACM0
    restart_policy: on-failure

  - id: follower
    path: dora-so101-follower
    inputs:
      cmd: leader/leader_cmd
    outputs:
      - follower_state
    env:
      PORT: /dev/ttyACM1 
    restart_policy: on-failure
    max_restarts: 5
    startup_timeout: 3.0

  - id: wrist-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video6
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg
    restart_policy: on-failure

  - id: overhead-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video4
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg
    restart_policy: on-failure

  - id: rerun
    path: dora-so101-rerun
    inputs:
      wrist: wrist-camera/image
      overhead: overhead-camera/image
      leader: leader/leader_cmd
      follower: follower/follower_state
    env:
      IMAGES: overhead, wrist
      ACTIONS: leader
      OBSERVATIONS: follower
      JOINTS: shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper

  # Recording is controlled from the web UI (record-ui): Start begins
  # an episode, End saves it, and the page then asks for success or
  # fail unless that prompt is unchecked. Open http://127.0.0.1:8080
  # while the graph runs.
  - id: record
    path: dora-so101-record
    inputs:
      command: record-ui/command
      cmd: leader/leader_cmd
      follower: follower/follower_state
      camera_wrist: wrist-camera/image
      camera_overhead: overhead-camera/image
    outputs:
      - status
    env:
      DIRECTORY: ../record
      NAME: pick-and-place
      TASK: Pick up the cube from the left box and place it in the right box.

  - id: record-ui
    path: dora-so101-collect-ui
    inputs:
      tick: dora/timer/hz/10
      status: record/status
    outputs:
      - command
    env:
      UI_HOST: 127.0.0.1
      UI_PORT: "8080"
      TASK_LIBRARY: ../record/task-library.json
      TASK: Pick up the cube from the left box and place it in the right box.
      RESULT_PROMPT: "on"
