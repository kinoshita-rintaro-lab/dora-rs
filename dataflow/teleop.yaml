nodes:
  - id: leader
    path: dora-so101-leader
    inputs: 
      tick: dora/timer/hz/60 
    outputs:
      - leader_cmd
    # restart_policy: on-failure
    env:
      PORT: /dev/ttyACM0
      GRIPPER_MODE: ${GRIPPER_MODE:-discrete}
    
  - id: follower
    path: dora-so101-follower
    inputs:
      cmd: leader/leader_cmd
    outputs:
      - follower_state
    # restart_policy: on-failure
    env:
      PORT: /dev/ttyACM1
      GRIPPER_MODE: ${GRIPPER_MODE:-discrete}
  
  - id: wrist-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30 
    outputs:
      - image
    # restart_policy: on-failure
    env:
      CAPTURE_PATH: /dev/video6
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg


  - id: overhead-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/hz/30 # 30fps
    outputs:
      - image
    # restart_policy: on-failure
    env:
      CAPTURE_PATH: /dev/video4
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: jpeg

  # - id: wrist-image-viewer
  #   path: opencv-plot
  #   inputs:
  #     image: wrist-camera/image

  # - id: image-viewer-2
  #   path: opencv-plot
  #   inputs:
  #     image: overhead-camera/image

  - id: rerun
    path: dora-so101-rerun
    inputs:
      wrist: wrist-camera/image
      overhead: overhead-camera/image
      leader: leader/leader_cmd
      follower: follower/follower_state
    env:
      IMAGES: overhead, wrist
      ACTIONS: leader
      OBSERVATIONS: follower
      JOINTS: shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper