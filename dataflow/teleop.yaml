nodes:
  - id: leader
    path: dora-so101-leader
    inputs: 
      tick: dora/timer/millis/16 # 60fps
    outputs:
      - leader_cmd
    env:
      PORT: /dev/ttyACM0
    
  - id: follower
    path: dora-so101-follower
    inputs:
      cmd: leader/leader_cmd
    outputs:
      - follower_state
    env:
      PORT: /dev/ttyACM1 
  
  - id: camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video4
      IMAGE_WIDTH: 320
      IMAGE_HEIGHT: 240
      FOURCC: MJPG
      ENCODING: jpeg
      FLIP: BOTH

  - id: camera-2
    path: opencv-video-capture
    inputs:
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video6
      IMAGE_WIDTH: 320
      IMAGE_HEIGHT: 240
      FOURCC: MJPG
      ENCODING: jpeg

  - id: image-viewer
    path: opencv-plot
    inputs:
      image: camera/image

  - id: image-viewer-2
    path: opencv-plot
    inputs:
      image: camera-2/image

