nodes:
  - id: leader
    path: dora-so101-leader
    inputs:
      tick: dora/timer/millis/16.6 # 60fps
    outputs:
      - leader_cmd
    env:
      PORT: /dev/ttyACM0

  - id: follower
    path: dora-so101-follower
    inputs:
      cmd: leader/leader_cmd
    outputs:
      - follower_state
    env:
      PORT: /dev/ttyACM1

  - id: wrist-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/millis/33.3 # 30fps
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video6
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: rgb8

  - id: overhead-camera
    path: opencv-video-capture
    inputs:
      tick: dora/timer/millis/33.3 # 30fps
    outputs:
      - image
    env:
      CAPTURE_PATH: /dev/video4
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 320
      FOURCC: MJPG
      ENCODING: rgb8

  - id: rerun
    path: dora-so101-rerun
    inputs:
      wrist: wrist-camera/image
      overhead: overhead-camera/image
      leader: leader/leader_cmd
      follower: follower/follower_state
    env:
      IMAGES: overhead, wrist
      ACTIONS: leader
      OBSERVATIONS: follower
      JOINTS: shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper

  - id: dataset-record
    build: pip install dora-dataset-record
    path: dora-dataset-record
    inputs:
      wrist: wrist-camera/image
      overhead: overhead-camera/image
      robot_state: follower/follower_state
      robot_action: leader/leader_cmd
    outputs:
      - text
    env:
      REPO_ID: test_username/test_dataset_name
      SINGLE_TASK: Pick up the cube and place it in the box
      ROBOT_TYPE: so101
      ROBOT_JOINTS: shoulder_pan,shoulder_lift,elbow_flex,wrist_flex,wrist_roll,gripper
      CAMERA_NAMES: wrist,overhead
      CAMERA_WRIST_RESOLUTION: 320,640,3
      CAMERA_OVERHEAD_RESOLUTION: 320,640,3
      FPS: 30
      TOTAL_EPISODES: 50
      EPISODE_DURATION_S: 60
      RESET_DURATION_S: 15
      USE_VIDEOS: true
      PUSH_TO_HUB: false
      ROOT_PATH: ../datasets
