nodes:
  - id: leader
    path: dora-so101-leader
    inputs: 
      tick: dora/timer/millis/16 # 60fps
    outputs:
      - leader_cmd
    env:
      PORT: /dev/ttyACM1
      # Sim scales a degree-like gripper. Discrete 0/1 would barely open it.
      GRIPPER_MODE: ${GRIPPER_MODE:-continuous}

  - id: mujoco
    path: dora-so101-mujoco
    inputs:
      leader_cmd: leader/leader_cmd
    outputs:
      - mujoco_state